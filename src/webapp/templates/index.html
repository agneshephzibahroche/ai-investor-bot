<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Financial Advisor Bot</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <!-- Custom styles -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body
    class="d-flex align-items-center justify-content-center min-vh-100 bg-light"
  >
    <!-- Container for flashes and card -->
    <div class="w-100" style="max-width: 420px">
      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, msg in messages %}
      <div
        class="alert alert-{{ 'danger' if category=='danger' else category }} alert-dismissible fade show"
        role="alert"
      >
        {{ msg }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>
      {% endfor %} {% endif %} {% endwith %}

      <!-- Main card -->
      <div class="card p-4 shadow-lg">
        <h2 class="text-center mb-3">Advisor Bot</h2>

        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="ticker">Ticker</label>
            <input
              list="tickers"
              id="ticker"
              name="ticker"
              class="form-control"
              placeholder="Select or type…"
              required
            />
            <datalist id="tickers">
              {% for t in tickers %}
              <option value="{{ t }}">{{ t }}</option>
              {% endfor %}
            </datalist>
          </div>

          <div class="mb-3">
            <label class="form-label" for="weeks">Horizon (weeks)</label>
            <input
              type="number"
              id="weeks"
              name="weeks"
              class="form-control"
              value="4"
              min="1"
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="start_date">Start Date</label>
            <input
              type="date"
              id="start_date"
              name="start_date"
              class="form-control"
              value="{{ default_start }}"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="end_date">End Date</label>
            <input
              type="date"
              id="end_date"
              name="end_date"
              class="form-control"
              value="{{ default_end }}"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Get Advice
          </button>
        </form>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
