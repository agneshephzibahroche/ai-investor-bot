<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4f3ef"/><stop offset="1" stop-color="#b9dcf6"/>
    </linearGradient>
    <radialGradient id="body" cx=".35" cy=".25" r=".85">
      <stop offset="0" stop-color="#ffe4ec"/><stop offset=".55" stop-color="#ffbccd"/><stop offset="1" stop-color="#f59ab2"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <!-- one blobby silhouette: round head + scalloped plush tentacles -->
    <g id="shape">
      <ellipse cx="32" cy="27" rx="18" ry="15.5"/>
      <rect x="14" y="30" width="36" height="13"/>
      <circle cx="14" cy="43" r="5.5"/><circle cx="23" cy="44" r="5.5"/><circle cx="32" cy="44.5" r="5.5"/>
      <circle cx="41" cy="44" r="5.5"/><circle cx="50" cy="43" r="5.5"/>
    </g>
    <polygon id="star" points="0,-3.4 .88,-1.21 3.23,-1.05 1.43,.46 2,2.75 0,1.5 -2,2.75 -1.43,.46 -3.23,-1.05 -.88,-1.21"/>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tile)"/>

  <!-- bubbles -->
  <g stroke="#8a4b5c" stroke-width="1.3">
    <circle cx="11.5" cy="14" r="3.2" fill="#e6faf7"/>
    <circle cx="17" cy="8" r="1.6" fill="#bfeee8"/>
  </g>

  <ellipse cx="32" cy="53.5" rx="19" ry="2.6" fill="#5a6c9a" opacity=".22" filter="url(#soft)"/>

  <!-- outline pass, then fill pass on top -->
  <use href="#shape" fill="#8a4b5c" stroke="#8a4b5c" stroke-width="4" stroke-linejoin="round"/>
  <use href="#shape" fill="url(#body)"/>

  <!-- polka-dot suckers -->
  <g fill="#fff4f7">
    <circle cx="13" cy="45.5" r="1.2"/><circle cx="22.5" cy="46.5" r="1.2"/><circle cx="32" cy="47" r="1.2"/>
    <circle cx="41.5" cy="46.5" r="1.2"/><circle cx="51" cy="45.5" r="1.2"/>
  </g>

  <!-- glossy highlight -->
  <path d="M18.5 22q1-5 6.5-7.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
  <circle cx="18" cy="25.8" r="1.1" fill="#fff" opacity=".85"/>

  <!-- star hair clips -->
  <g stroke="#8a4b5c" stroke-width="1.1" stroke-linejoin="round">
    <use href="#star" fill="#9edcf7" transform="translate(40.5 13.8) rotate(-12)"/>
    <use href="#star" fill="#ffd96b" transform="translate(47.3 17.6) rotate(16)"/>
  </g>

  <!-- face -->
  <ellipse cx="25" cy="28" rx="1.8" ry="2.3" fill="#3b2a32"/>
  <ellipse cx="39" cy="28" rx="1.8" ry="2.3" fill="#3b2a32"/>
  <circle cx="25.6" cy="27.1" r=".6" fill="#fff"/>
  <circle cx="39.6" cy="27.1" r=".6" fill="#fff"/>
  <ellipse cx="19.2" cy="32.5" rx="3.9" ry="2.7" fill="#ff7f9d" opacity=".55"/>
  <ellipse cx="44.8" cy="32.5" rx="3.9" ry="2.7" fill="#ff7f9d" opacity=".55"/>
  <path d="M29.6 31.6q2.4 2.3 4.8 0" fill="none" stroke="#3b2a32" stroke-width="1.5" stroke-linecap="round"/>
</svg>
